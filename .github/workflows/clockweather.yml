name: ClockWeather

on:
  push:
    branches: ['**']
    tags: ['clockweather-v*']
    paths: ['ClockWeather/**', '.github/workflows/clockweather.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the C# compiler that ships with Windows
        shell: cmd
        run: ClockWeather\build.cmd

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item ClockWeather\ClockWeather.exe, ClockWeather\README.md dist\
          Compress-Archive -Path dist\* -DestinationPath ClockWeather.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClockWeather
          path: ClockWeather.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/clockweather-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^clockweather-', ''
          gh release create $tag ClockWeather.zip ClockWeather\ClockWeather.exe `
            --title "ClockWeather $version" --notes-file ClockWeather\RELEASE_NOTES.md
